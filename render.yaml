# Déploiement Render (https://render.com) — Dashboard > New > Blueprint > choisir ce dépôt
services:
  - type: web
    name: mboalearn
    runtime: node
    # « starter » est nécessaire pour le disque persistant (base de données + fichiers).
    # Sur l'offre « free », toutes les données sont effacées à chaque redémarrage.
    plan: starter
    region: frankfurt # région la plus proche de l'Afrique centrale
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: mboalearn-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data/db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      # Identifiants du compte administrateur (saisis par vous lors du déploiement)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # true = tuteurs et cours de démonstration ; passez à false avant le vrai lancement
      - key: SEED_DEMO
        value: "true"
      - key: COMMISSION_RATE
        value: "12"
      # simulator | notchpay | campay | flutterwave
      - key: PAYMENT_PROVIDER
        value: simulator
      - key: NOTCHPAY_PUBLIC_KEY
        sync: false
      - key: NOTCHPAY_PRIVATE_KEY
        sync: false
      - key: NOTCHPAY_HASH_KEY
        sync: false
      - key: CAMPAY_USERNAME
        sync: false
      - key: CAMPAY_PASSWORD
        sync: false
      - key: CAMPAY_WEBHOOK_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_SECRET_HASH
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
